name: Publish Ruby SDK to RubyGems

# RubyGems gem: bella_baxter
# Install: gem install bella_baxter
# Requires secret: RUBYGEMS_API_KEY

on:
  push:
    tags:
      - 'v*'

env:
  SDK_FOLDER: .

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ruby-gems-bella-baxter
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version-file: ${{ env.SDK_FOLDER }}/.ruby-version
          bundler-cache: false

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing bella_baxter $VERSION"

      - name: Verify gem version matches tag
        run: |
          GEM_VERSION=$(ruby -e "require_relative 'lib/bella_baxter/version'; puts BellaBaxter::VERSION")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$GEM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::version.rb has $GEM_VERSION but tag is $TAG_VERSION — run release-sdk.yml first"
            exit 1
          fi
          echo "✓ version.rb $GEM_VERSION matches tag $TAG_VERSION"

      - name: Install kiota
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'
      - run: dotnet tool install --global Microsoft.OpenApi.Kiota --version 1.30.0

      - name: Set production API URL
        run: |
          BELLA_BAXTER_API_URL="${{ vars.BELLA_BAXTER_API_URL || 'https://api.bella-baxter.io' }}"
          if [ "$BELLA_BAXTER_API_URL" != "https://api.bella-baxter.io" ]; then
            grep -rl 'https://api.bella-baxter.io' . --include='*.rb' \
              | xargs sed -i "s|https://api.bella-baxter.io|${BELLA_BAXTER_API_URL}|g"
          fi

      # #991: `kiota update` alone produces a client that names classes which do not exist (Int64,
      # Double); the fix step rewrites them and FAILS if it finds nothing to rewrite.
      - name: Generate Kiota Ruby client
        run: |
          kiota update \
            --output lib/bella_baxter/generated \
            --log-level Warning
          ruby scripts/fix_generated_primitives.rb lib/bella_baxter/generated

      # #991: the gem shipped unloadable because nothing ever required it. Build it, install it into a
      # throwaway GEM_HOME and decode a response through the installed copy before anything is pushed.
      - name: Verify the gem loads and decodes a response
        run: scripts/verify_gem.sh

      - name: Build gem
        run: gem build bella_baxter.gemspec

      - name: Configure RubyGems credentials (OIDC trusted publisher)
        uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0

      - name: Push to RubyGems
        run: gem push *.gem

  notify:
    runs-on: ubuntu-latest
    needs: [publish]
    if: always()
    steps:
      - uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            text: "${{ needs.publish.result == 'success' && '✅' || needs.publish.result == 'failure' && '❌' || '⚠️' }} *SDK Ruby (bella_baxter) gem publish ${{ github.ref_name }}*: ${{ needs.publish.result }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
